name: Test

"on":
  workflow_dispatch:

# Builds and tests each platform on the runner that can build it:
#
#   macOS ARM64 -> :curl-kmp metadata + jvm + all Apple target klibs
#                  (with the embedded libcurl/mbedTLS static library), the
#                  :jni-jvm-darwin-* JNI artifacts, JVM + native tests, and
#                  the example app (native + JVM)
#   Linux x64   -> linuxX64 klib (with embedded static library) and the
#                  cross-compiled linuxArm64/mingwX64 klibs (built with the
#                  libcurl static library compiled via the cross toolchain),
#                  the :jni-jvm-linux-* JNI artifacts, JVM + native tests,
#                  and the example app (native)
#   Windows x64 -> the windows-x86_64 JNI artifact (native MinGW build) and
#                  JVM tests
#   Android x64 -> the four androidNative klibs (with the embedded static
#                  library built via the Android NDK)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :curl-kmp:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :curl-kmp:jvmTest

      - name: Run native tests (macosArm64)
        run: ./gradlew --no-daemon :curl-kmp:macosArm64Test

      - name: Run example (JVM)
        run: ./gradlew --no-daemon :examples:curl_http:jvmRun

      - name: Run example (macosArm64)
        run: ./gradlew --no-daemon :examples:curl_http:runDebugExecutableMacosArm64

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxX64/linuxArm64/mingwX64 klibs and the linux JNI artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :curl-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :curl-kmp:publishLinuxX64PublicationToMavenLocal
          :curl-kmp:publishLinuxArm64PublicationToMavenLocal
          :curl-kmp:publishMingwX64PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :curl-kmp:jvmTest

      - name: Run native tests (linuxX64)
        run: ./gradlew --no-daemon :curl-kmp:linuxX64Test

      - name: Run example (linuxX64)
        run: ./gradlew --no-daemon :examples:curl_http:runDebugExecutableLinuxX64

  test-android:
    name: Test Android (androidNative klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The androidNative klibs embed the static libcurl library, which is
      # cross-compiled with the Android NDK.
      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :curl-kmp:compileKotlinAndroidNativeArm64
          :curl-kmp:compileKotlinAndroidNativeArm32
          :curl-kmp:compileKotlinAndroidNativeX64
          :curl-kmp:compileKotlinAndroidNativeX86

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          # cmake.exe may not be on PATH for the Gradle daemon.
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish windows JNI to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :curl-kmp:jvmTest